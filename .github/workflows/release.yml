# Publishes cwl-link to npm through npm trusted publishing (OIDC).
#
# One-time setup on npmjs.com, by a package maintainer:
#   cwl-link -> Settings -> Trusted Publisher -> GitHub Actions
#   Organization or user: michiharu
#   Repository:           cwl-link
#   Workflow filename:    release.yml
#   Environment name:     (leave empty)
#
# To release: bump "version" in package.json on main, then create a GitHub Release
# whose tag is "v" followed by that version (for example v2.0.0). Publishing the
# release runs this workflow. Provenance is attached automatically.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      # Node 24 matches mise.toml and ships an npm new enough for trusted publishing (11.5.1+).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check that the release tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version v$version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # prepublishOnly runs "pnpm test" (typecheck, jest, build, smoke test) before the upload.
      - run: npm publish
